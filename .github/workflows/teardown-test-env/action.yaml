name: 'Teardown Testing Environment'
description: 'Stop and remove test environment services after workflow completion.'

runs:
  using: 'composite'
  steps:
    - name: Cleanup temporary test files
      shell: bash
      run: |
        rm -f .env

    - name: Remove Test Environment Variables File
      shell: bash
      run: |
        rm -f /tmp/test_env_vars.txt
